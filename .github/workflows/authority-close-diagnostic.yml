name: Authority close diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: authority-close-diagnostic-${{ github.ref }}
  cancel-in-progress: true

# Temporary diagnosis only. This adds no authority and replaces no Required job.
# Remove it after the fresh-process versus suite-context comparison is recorded.
jobs:
  compare:
    name: Compare native pipe closure contexts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch only governed diagnostic history
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Diagnostic source is not one exact commit"
            exit 1
          fi
          test "$(git rev-parse --is-shallow-repository)" = "true"
          git fetch --force --no-tags --unshallow origin \
            "+$VERIFIED_SHA:refs/remotes/ci/verified"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$VERIFIED_SHA"
          test "$(git rev-parse --verify 'refs/remotes/ci/verified^{commit}')" = "$VERIFIED_SHA"
          while IFS= read -r ci_ref; do
            case "$ci_ref" in
              refs/remotes/ci/verified) ;;
              *)
                echo "::error::Unexpected ref entered governed diagnostic history"
                exit 1
                ;;
            esac
          done < <(git for-each-ref --format='%(refname)')
          test "$(git for-each-ref --format='%(refname)' | wc -l | tr -d ' ')" = "1"

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download pinned Zig 0.16.0
        run: |
          HRA_ZIG_DIRECTORY="$RUNNER_TEMP/hra-zig-0.16.0"
          HRA_ZIG_ARCHIVE="$HRA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0.tar.xz"
          HRA_ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          mkdir -p "$HRA_ZIG_DIRECTORY"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors --retry-delay 1 \
            --output "$HRA_ZIG_ARCHIVE" \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          printf '%s  %s\n' "$HRA_ZIG_SHA256" "$HRA_ZIG_ARCHIVE" | sha256sum --check --status
          tar -xJf "$HRA_ZIG_ARCHIVE" -C "$HRA_ZIG_DIRECTORY"
          test -x "$HRA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0/zig"

      - name: Rebuild and verify exact native artifacts
        run: >-
          bun ./scripts/verify-authority-supervisor-build.ts
          --zig "$RUNNER_TEMP/hra-zig-0.16.0/zig-x86_64-linux-0.16.0/zig"

      - name: Enable isolated user namespaces
        id: custody
        run: |
          test "$(/usr/sbin/sysctl --values kernel.unprivileged_userns_clone)" = "1"
          sudo /usr/sbin/sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          test "$(/usr/sbin/sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"
          /usr/bin/unshare --user --map-root-user --fork /usr/bin/true

      - name: Unchanged GO case in a fresh process
        id: focused
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: >-
          bun test ./scripts/authority-supervisor-runtime.test.ts
          --test-name-pattern '^authority supervisor holds a target behind GO$'
          --isolate --max-concurrency=1

      - name: Whole native test file in a fresh process
        id: file
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bun test ./scripts/authority-supervisor-runtime.test.ts --isolate --max-concurrency=1

      - name: Unchanged scripts sweep in a fresh process
        id: suite
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bun test ./scripts --isolate --max-concurrency=1

      - name: Record every diagnostic outcome without overriding failures
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        env:
          FOCUSED_RESULT: ${{ steps.focused.outcome }}
          FILE_RESULT: ${{ steps.file.outcome }}
          SUITE_RESULT: ${{ steps.suite.outcome }}
        run: |
          printf 'focused=%s file=%s suite=%s\n' "$FOCUSED_RESULT" "$FILE_RESULT" "$SUITE_RESULT"
          test "$FOCUSED_RESULT" = "success" && test "$FILE_RESULT" = "success" && test "$SUITE_RESULT" = "success"

      - name: Restore Ubuntu user-namespace restriction
        if: ${{ always() }}
        run: |
          sudo /usr/sbin/sysctl --write kernel.apparmor_restrict_unprivileged_userns=1
          test "$(/usr/sbin/sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "1"
