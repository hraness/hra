name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Source, test, and unsigned build gate
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pinned Apple Silicon Zig toolchain
        shell: bash
        env:
          HRA_ZIG_URL: https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          HRA_ZIG_SHA256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
        run: |
          set -euo pipefail
          if [[ "$(/usr/bin/uname -m)" != "arm64" ]]; then
            echo "::error::Native HRA CI requires an Apple Silicon runner"
            exit 1
          fi
          archive="$RUNNER_TEMP/zig-aarch64-macos-0.16.0.tar.xz"
          toolchain="$RUNNER_TEMP/zig-aarch64-macos-0.16.0"
          /usr/bin/curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --output "$archive" "$HRA_ZIG_URL"
          actual_sha256="$(/usr/bin/shasum -a 256 "$archive" | /usr/bin/awk '{print $1}')"
          if [[ "$actual_sha256" != "$HRA_ZIG_SHA256" ]]; then
            echo "::error::Pinned Zig archive SHA-256 mismatch"
            exit 1
          fi
          /bin/mkdir -p "$toolchain"
          /usr/bin/tar -xJf "$archive" -C "$toolchain" --strip-components=1
          [[ "$("$toolchain/zig" version)" == "0.16.0" ]]
          echo "NATIVE_SDK_ZIG=$toolchain/zig" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Verify policies, source, tests, and builds
        run: bun run check:complete
      - name: Run native macOS tests
        run: bun run --cwd apps/desktop test:macos
      - name: Build ReleaseFast macOS native binaries
        run: bun run --cwd apps/desktop build:macos
