name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch only governed CI history
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CI source is not one exact commit"
            exit 1
          fi
          test "$(git rev-parse --is-shallow-repository)" = "true"
          git fetch --force --no-tags --unshallow origin \
            "+$VERIFIED_SHA:refs/remotes/ci/verified"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$VERIFIED_SHA"
          test "$(git rev-parse --verify 'refs/remotes/ci/verified^{commit}')" = "$VERIFIED_SHA"
          while IFS= read -r ci_ref; do
            case "$ci_ref" in
              refs/remotes/ci/verified) ;;
              *)
                echo "::error::Unexpected ref entered governed CI history"
                exit 1
                ;;
            esac
          done < <(git for-each-ref --format='%(refname)')
          test "$(git for-each-ref --format='%(refname)' | wc -l | tr -d ' ')" = "1"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download pinned Zig 0.16.0 for authority supervisor (Linux)
        if: runner.os == 'Linux'
        run: |
          HRA_ZIG_DIRECTORY="$RUNNER_TEMP/hra-zig-0.16.0"
          HRA_ZIG_ARCHIVE="$HRA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0.tar.xz"
          HRA_ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          mkdir -p "$HRA_ZIG_DIRECTORY"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors --retry-delay 1 \
            --output "$HRA_ZIG_ARCHIVE" \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          printf '%s  %s\n' "$HRA_ZIG_SHA256" "$HRA_ZIG_ARCHIVE" | sha256sum --check --status
          tar -xJf "$HRA_ZIG_ARCHIVE" -C "$HRA_ZIG_DIRECTORY"
          test -x "$HRA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0/zig"

      - name: Rebuild and verify authority-supervisor artifacts (Linux)
        if: runner.os == 'Linux'
        run: >-
          bun ./scripts/verify-authority-supervisor-build.ts
          --zig "$RUNNER_TEMP/hra-zig-0.16.0/zig-x86_64-linux-0.16.0/zig"

      - name: Enable isolated user namespaces for native custody checks
        if: runner.os == 'Linux'
        run: |
          test "$(/usr/sbin/sysctl --values kernel.unprivileged_userns_clone)" = "1"
          sudo /usr/sbin/sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          test "$(/usr/sbin/sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"
          /usr/bin/unshare --user --map-root-user --fork /usr/bin/true

      - name: Run Linux authority-supervisor custody test
        if: runner.os == 'Linux'
        run: bun test scripts/authority-supervisor-runtime.test.ts --isolate --max-concurrency=1

      - name: Verify generated public documents
        run: bun run build:site -- --check

      - name: Run the repository gate
        run: bun run check

      - name: Restore Ubuntu user-namespace restriction
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          sudo /usr/sbin/sysctl --write kernel.apparmor_restrict_unprivileged_userns=1
          test "$(/usr/sbin/sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "1"

  required:
    name: Required
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = "success"
