name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download pinned Zig 0.16.0 for authority supervisor (Linux)
        if: runner.os == 'Linux'
        run: |
          HRA_ZIG_DIRECTORY="$RUNNER_TEMP/hra-zig-0.16.0"
          HRA_ZIG_ARCHIVE="$HRA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0.tar.xz"
          HRA_ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          mkdir -p "$HRA_ZIG_DIRECTORY"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors --retry-delay 1 \
            --output "$HRA_ZIG_ARCHIVE" \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          printf '%s  %s\n' "$HRA_ZIG_SHA256" "$HRA_ZIG_ARCHIVE" | sha256sum --check --status
          tar -xJf "$HRA_ZIG_ARCHIVE" -C "$HRA_ZIG_DIRECTORY"
          test -x "$HRA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0/zig"

      - name: Rebuild and verify authority-supervisor artifacts (Linux)
        if: runner.os == 'Linux'
        run: >-
          bun ./scripts/verify-authority-supervisor-build.ts
          --zig "$RUNNER_TEMP/hra-zig-0.16.0/zig-x86_64-linux-0.16.0/zig"

      - name: Run Linux authority-supervisor custody test
        if: runner.os == 'Linux'
        run: bun test scripts/authority-supervisor-runtime.test.ts --isolate --max-concurrency=1

      - name: Verify generated public documents
        run: bun run build:site -- --check

      - name: Run the repository gate
        run: bun run check

  required:
    name: Required
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = "success"
